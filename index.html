<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XVX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #5c0811 0%, #2b0206 55%, #120002 100%);
      position: relative;
      padding: 20px;
    }

    /* Galaxy constellation canvas */
    #galaxyCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 360px;
      padding: 36px 28px 30px;
      border-radius: 20px;
      background: rgba(20, 4, 7, 0.72);
      border: 1px solid rgba(255, 75, 90, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 35px rgba(220, 38, 38, 0.22);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .brand-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand-fire {
      position: absolute;
      width: 150px;
      height: 58px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 65%, rgba(255, 200, 60, 0.75) 0%, rgba(255, 90, 20, 0.65) 38%, rgba(220, 38, 38, 0.45) 68%, transparent 80%);
      filter: blur(12px);
      animation: fireFlicker 1.3s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    .brand {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
      color: #ffffff;
      text-shadow:
        0 -2px 6px rgba(255, 215, 100, 0.9),
        0 -6px 14px rgba(255, 95, 25, 0.85),
        0 0 24px rgba(239, 68, 68, 0.95);
      animation: textFlame 1.1s ease-in-out infinite alternate;
    }

    @keyframes fireFlicker {
      0% {
        transform: scale(0.95, 0.92) translateY(2px);
        opacity: 0.82;
      }
      50% {
        transform: scale(1.06, 1.1) translateY(-3px);
        opacity: 1;
      }
      100% {
        transform: scale(0.98, 1.04) translateY(-1px);
        opacity: 0.9;
      }
    }

    @keyframes textFlame {
      0% {
        text-shadow:
          0 -2px 6px rgba(255, 215, 100, 0.85),
          0 -6px 14px rgba(255, 95, 25, 0.8),
          0 0 22px rgba(239, 68, 68, 0.9);
      }
      100% {
        text-shadow:
          0 -4px 10px rgba(255, 230, 120, 1),
          0 -10px 20px rgba(255, 80, 20, 0.95),
          0 0 30px rgba(239, 68, 68, 1);
      }
    }

    .form-group {
      margin-bottom: 16px;
    }

    .input-field {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 90, 105, 0.28);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .input-field::placeholder {
      color: rgba(255, 210, 215, 0.55);
      text-transform: lowercase;
    }

    .input-field:focus {
      border-color: #ef4444;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.22);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-confirm {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 8px 22px rgba(220, 38, 38, 0.35);
    }

    .btn-confirm:hover {
      filter: brightness(1.08);
      box-shadow: 0 10px 26px rgba(239, 68, 68, 0.5);
    }

    .btn-confirm:active {
      transform: scale(0.98);
    }

    .btn-get-key {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(239, 68, 68, 0.45);
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.12);
      color: #ffd6da;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .btn-get-key:hover {
      background: rgba(239, 68, 68, 0.22);
      border-color: rgba(239, 68, 68, 0.75);
      color: #ffffff;
    }

    .btn-get-key:active {
      transform: scale(0.98);
    }

    .status-msg {
      margin-top: 16px;
      min-height: 24px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ff8a93;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .status-msg.success {
      color: #86efac;
    }

    .status-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    .shake {
      animation: shake 0.3s ease;
    }

    /* Floating draggable panel */
    .floating-panel {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 240px;
      z-index: 50;
      border-radius: 16px;
      background: rgba(18, 4, 7, 0.88);
      border: 1px solid rgba(239, 68, 68, 0.55);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.75), 0 0 28px rgba(239, 68, 68, 0.28);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    .floating-panel.open {
      display: flex;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.35), rgba(127, 29, 29, 0.4));
      border-bottom: 1px solid rgba(255, 90, 105, 0.25);
      cursor: grab;
      touch-action: none;
    }

    .panel-header:active {
      cursor: grabbing;
    }

    .panel-title {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .panel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .panel-close {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ffd6da;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .panel-close:hover {
      background: rgba(239, 68, 68, 0.5);
      color: #ffffff;
    }

    .panel-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .player-stage {
      width: 165px;
      height: 220px;
      border-radius: 12px;
      background: #120205;
      border: 1px solid rgba(255, 90, 105, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .player-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .player-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #targetGroup {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ratio-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.55);
      color: #ffd6da;
    }

    .zone-label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fbcfe8;
    }

    .ratio-group {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .ratio-btn {
      padding: 9px 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 90, 105, 0.3);
      background: rgba(255, 255, 255, 0.05);
      color: #ffd6da;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ratio-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.65);
    }


    .ff-group {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 90, 105, 0.18);
    }

    .ff-btn {
      padding: 8px 6px;
      border-radius: 10px;
      border: 1px solid rgba(255, 90, 105, 0.25);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 214, 218, 0.78);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ff-btn:hover {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.55);
    }

    .ff-btn.active {
      background: rgba(239, 68, 68, 0.28);
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
    }

    .ratio-btn.active {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border-color: #ff7b86;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.45);
    }

    /* Get Key loading & credentials modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(10, 2, 4, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 300px;
      padding: 26px 22px;
      border-radius: 18px;
      background: rgba(22, 4, 8, 0.94);
      border: 1px solid rgba(239, 68, 68, 0.5);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 30px rgba(239, 68, 68, 0.25);
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 3px solid rgba(239, 68, 68, 0.22);
      border-top-color: #ef4444;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .modal-wait-text {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .modal-countdown {
      font-size: 0.85rem;
      color: #fda4af;
    }

    .creds-box {
      display: none;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .creds-box.visible {
      display: flex;
    }

    .creds-title {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #86efac;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .cred-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 90, 105, 0.25);
      font-size: 0.9rem;
    }

    .cred-label {
      color: rgba(255, 210, 215, 0.7);
      font-weight: 600;
    }

    .cred-val {
      color: #ffffff;
      font-weight: 700;
      font-family: monospace;
      font-size: 0.98rem;
    }

    .modal-close-btn {
      margin-top: 14px;
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-close-btn:hover {
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <canvas id="galaxyCanvas" aria-hidden="true"></canvas>

  <main class="card">
    <div class="brand-wrap">
      <div class="brand-fire" aria-hidden="true"></div>
      <h1 class="brand">XVX</h1>
    </div>

    <form id="xvxForm" novalidate>
      <div class="form-group">
        <input
          id="keyInput"
          class="input-field"
          type="text"
          placeholder="user"
          aria-label="user"
          autocomplete="off"

      <div class="form-group">
        <input
          id="passwordInput"
          class="input-field"
          type="password"
          placeholder="password"
          aria-label="password"
          autocomplete="off"
        />

      <div class="actions">
        <button type="submit" id="confirmBtn" class="btn-confirm">confirm</button>
        <button type="button" id="getKeyBtn" class="btn-get-key">get key</button>

      <div id="statusMsg" class="status-msg" role="status" aria-live="polite"></div>
    </form>
